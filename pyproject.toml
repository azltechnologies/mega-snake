[project]
name = "mega_snake"
version = "0.1.5"
description = "CLI automation platform for Java development in VS Code"
authors = [
    { name = "Morales Ortega, Carlos Alberto", email = "carlos.mor.ort@gmail.com" },
]
dynamic = ["readme"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "click==8.4.2",
    "colorama==0.4.6",
    "directory-tree==1.0.0",
    "graphql-core==3.2.11",
    "jq==1.12.0",
    "json-spec==0.12.0",
    "jsoncomment==0.4.2",
    "pyperclip==1.11.0",
    # Direct dependency, not just a rich-click transitive one: 'mgsnake man' imports rich.markdown
    # to render the reference for the terminal.
    "rich==15.0.0",
    "rich-click==1.9.8",
    "types-colorama==0.4.15.20260508",
    "virtualenv==21.7.4",
    "pytest-mock==3.15.1",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=6.0.0",
    "pytest==9.1.1",
    "mypy==2.3.0",
    "mypy-extensions==1.1.0",
    "pytest-html>=4.1.1",
    "ruff>=0.1.0",
    "pip-audit>=2.7.0",
    # Floor is load-bearing: twine <= 6.0 parses distribution metadata through 'pkginfo', which only
    # knows Metadata-Version up to 2.2 and silently yields empty fields for anything newer instead of
    # failing on the version itself. Hatchling emits 2.5, so an older twine reports the symptom
    # ("missing required fields: Name, Version") on a perfectly valid wheel. 6.1 dropped pkginfo for
    # 'packaging'. Always run it as 'uv run twine check dist/*' so the pinned version is used and not
    # whatever the system happens to provide.
    "twine>=6.1",
]

[project.urls]
Repository = "https://github.com/kalin91/mega-snake"

[project.scripts]
# Points at main(), never at cli(): main() is the only place an exception is turned into an exit
# code (and the except hook that delivers it is installed). Pointing this at the click group makes
# every failure exit 1.
mgsnake = "mega_snake.__main__:main"

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mega_snake"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "COMMANDS.md"

[tool.mypy]
# Must be an exact 'x.y' version: mypy rejects a range and silently falls back to the running
# interpreter. Pin it to the lowest version 'requires-python' supports, so type checking catches
# what would break on the oldest interpreter we claim to run on.
python_version = "3.12"
disable_error_code = ["import-untyped"]
mypy_path = "./out"
exclude = [
    '\.venv/.*',
    '.+\.pyi',
    '/opt/.*',
    '.*/site-packages/.*',
    'workspace_temp/.*',
    'src/tests/.*',
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=mega_snake --cov-report=term-missing --cov-report=html:coverage_html --cov-fail-under=95 --html=report.html"

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_also = ["\\s*TYPE_CHECKING:\\s*\\n\\s*from.*"]

[tool.ruff]
# Deliberately more permissive than the 88/100 defaults: this codebase favours full sentences in
# comments and long, explicit type annotations over wrapping them.
line-length = 120


# Exclude generated, vendored and scratch folders: nothing here is source we own.
exclude = [
    ".venv",
    "build",
    "dist",
    "__pycache__",
    "*.pyc",
    "*.egg-info",
    "node_modules",
    "workspace_temp",
    "src/tests",
]
include = ["src/**/*.py"]
[tool.ruff.lint]
# D1 and ANN2 enforce §6.1: a docstring on every public symbol, a return annotation on every function.
select = ["E", "F", "D1", "ANN2"]
# Two pycodestyle checks that fight the formatting conventions used throughout this codebase.
extend-ignore = [
    "E303", # too many blank lines
    "E701", # multiple statements on one line
]
