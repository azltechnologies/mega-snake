[project]
name = "mega_snake"
version = "0.1.7"
description = "CLI automation platform for Java development in VS Code"
authors = [
    { name = "Morales Ortega, Carlos Alberto", email = "carlos.mor.ort@gmail.com" },
]
dynamic = ["readme"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "click==8.4.2",
    "colorama==0.4.6",
    "directory-tree==1.0.0",
    "graphql-core==3.2.11",
    "jq==1.12.0",
    "json-spec==0.12.0",
    "jsoncomment==0.4.2",
    "pyperclip==1.11.0",
    # Used by the jira_api module only, and imported *inside* the function that builds the HTTP
    # session, never at module level. That keeps the ~100 ms import off every non-Jira command,
    # while the Jira commands pay it right before a network call that costs multiples of it.
    # 'test_requests_is_not_imported_at_module_import_time' pins this; do not hoist the import.
    # Retry (backoff, Retry-After, which statuses to replay) and connection pooling are delegated to
    # it and to urllib3 on purpose: hand-rolling either is where the bugs live.
    "requests==2.34.2",
    # Direct dependency, not just a rich-click transitive one: 'mgsnake man' imports rich.markdown
    # to render the reference for the terminal.
    "rich==15.0.0",
    "rich-click==1.9.8",
    "types-colorama==0.4.15.20260508",
    "virtualenv==21.7.7",
    "pytest-mock==3.15.1",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=6.0.0",
    "pytest==9.1.1",
    "mypy==2.3.1",
    "mypy-extensions==1.1.0",
    "pytest-html>=4.1.1",
    "ruff>=0.1.0",
    "pip-audit>=2.7.0",
    # Stubs only mypy consumes, hence dev and not runtime. 'requests' ships no inline types, and
    # this project sets disable_error_code = ["import-untyped"], so without the stubs mypy would not
    # complain — it would simply stop type checking every call into the HTTP client.
    "types-requests==2.33.0.20260712",
    # Floor is load-bearing: twine <= 6.0 parses distribution metadata through 'pkginfo', which only
    # knows Metadata-Version up to 2.2 and silently yields empty fields for anything newer instead of
    # failing on the version itself. Hatchling emits 2.5, so an older twine reports the symptom
    # ("missing required fields: Name, Version") on a perfectly valid wheel. 6.1 dropped pkginfo for
    # 'packaging'. Always run it as 'uv run twine check dist/*' so the pinned version is used and not
    # whatever the system happens to provide.
    "twine>=6.1",
]

[project.urls]
Repository = "https://github.com/kalin91/mega-snake"

[project.scripts]
# Points at main(), never at cli(): main() is the only place an exception is turned into an exit
# code (and the except hook that delivers it is installed). Pointing this at the click group makes
# every failure exit 1.
mgsnake = "mega_snake.__main__:main"

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mega_snake"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "COMMANDS.md"

[tool.mypy]
# Must be an exact 'x.y' version: mypy rejects a range and silently falls back to the running
# interpreter. Pin it to the lowest version 'requires-python' supports, so type checking catches
# what would break on the oldest interpreter we claim to run on.
python_version = "3.12"
disable_error_code = ["import-untyped"]
mypy_path = "./out"
exclude = [
    '\.venv/.*',
    '.+\.pyi',
    '/opt/.*',
    '.*/site-packages/.*',
    'workspace_temp/.*',
    'src/tests/.*',
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=mega_snake --cov-report=term-missing --cov-report=html:coverage_html --cov-fail-under=95 --html=report.html"

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_also = ["\\s*TYPE_CHECKING:\\s*\\n\\s*from.*"]

[tool.ruff]
# Preserved the more permissive line length you had in pylint
line-length = 120


# Exclude large/irrelevant folders (equivalent to your flake8/pylint excludes)
exclude = [
    ".venv",
    "build",
    "dist",
    "__pycache__",
    "*.pyc",
    "*.egg-info",
    "node_modules",
    "workspace_temp",
    "src/tests",
]
include = ["src/**/*.py"]
[tool.ruff.lint]
select = ["E", "F", "D1", "ANN2"]
# Ignore pycodestyle checks you had in flake8
extend-ignore = [
    "E303", # too many blank lines
    "E701", # multiple statements on one line
]
