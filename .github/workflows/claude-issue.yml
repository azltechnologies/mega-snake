name: Claude Code (Issue)

# Claude on an issue: the entry point for new work. The action always creates a
# fresh branch here (it cannot commit to an issue), and normally opens a PR from
# it. Once that PR exists, follow-up work belongs in claude-pr.yml, where Claude
# commits to the PR branch and the thread continues naturally.
#
# See the "Find previous Claude branch" step for what happens when you comment
# again on the issue instead.
#
# NOTE: `issues` and `issue_comment` are not `pull_request` events, so GitHub
# always runs this file from the DEFAULT branch. Edits here cannot be tested
# from a PR — they only take effect once merged.
on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]

jobs:
  claude:
    # The negated `github.event.issue.pull_request` keeps PR comments out; those
    # belong to claude-pr.yml.
    if: |
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for Claude to push commits and branches
      pull-requests: write # Required for Claude to open/update PRs
      issues: write # Required for Claude to update its progress comment
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The session actions are read from the DEFAULT BRANCH, never from the tree
      # this job checked out.
      #
      # A local `uses: ./…` is resolved against the *checked-out workspace*, not
      # against the ref the workflow file itself came from. These workflows run
      # from the default branch but check out the pull request's branch, so a
      # branch created before the session actions existed made the run die with
      # "Can't find 'action.yml' … under .github/actions/restore-claude-session"
      # — before Claude had even started, so the request was lost entirely rather
      # than answered without history. That is not hypothetical: it is how run
      # 32191217625 failed, and why no session has ever been saved.
      #
      # Pinning them here fixes that for every branch, however old, and closes a
      # second hole on the way: a pull request can no longer edit the action that
      # handles the session cache and have this job run its version.
      #
      # `setup-env` is deliberately NOT pinned. It contains a nested local
      # `uses: ./.github/actions/setup-ai-context`, whose resolution from a
      # relocated composite action is exactly the ambiguity this step exists to
      # avoid — and it cannot be tested from a pull request. It has also existed
      # far longer than any branch likely to run here.
      - name: Check out the pinned session actions
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .ci-actions
          sparse-checkout: .github/actions
          fetch-depth: 1

      - name: Set up environment
        uses: ./.github/actions/setup-env
        with:
          requires-ai-context: "true"
          source-repo: ${{ secrets.AI_CONTEXT }}
          context-token: ${{ secrets.AI_CONTEXT_TOKEN }}

      - name: Find previous Claude branch for this issue
        id: prev_branch
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # The action names issue branches 'claude/issue-<n>-<YYYYmmdd-HHMM>' and
          # never reuses an existing one: a follow-up comment would otherwise branch
          # off the default branch and redo the work from scratch. Pointing
          # base_branch at the newest previous branch makes the new one a descendant
          # of it, so the earlier work carries over.
          #
          # The timestamp is zero-padded, so a lexicographic sort is chronological.
          # The trailing '-' in the pattern keeps issue #5 from matching issue #50.
          branch=$(git ls-remote --heads origin "refs/heads/claude/issue-${ISSUE_NUMBER}-*" \
            | awk '{print $2}' | sed 's#^refs/heads/##' | sort | tail -n 1)
          if [ -n "${branch}" ]; then
            echo "Continuing from previous branch: ${branch}"
            echo "base=${branch}" >> "$GITHUB_OUTPUT"
          else
            echo "No previous branch for issue #${ISSUE_NUMBER}; starting from the default branch"
            echo "base=" >> "$GITHUB_OUTPUT"
          fi

      - name: Parse trigger directives
        id: model
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          # A directive belongs to the text that triggered THIS run: the comment
          # on `issue_comment`, the issue itself on `issues` (where the comment
          # body is empty). Reading all three at once would make every directive
          # permanent instead -- one "@claude opus" in the issue body would pin
          # the model for every later comment on the thread, and one mention of
          # "new session" would reset the conversation on every single run,
          # quietly defeating the persistence below.
          if [ -n "$COMMENT_BODY" ]; then
            trigger="$COMMENT_BODY"
          else
            trigger=$(printf '%s\n%s\n' "$ISSUE_TITLE" "$ISSUE_BODY")
          fi
          body=$(printf '%s' "$trigger" | tr '[:upper:]' '[:lower:]')
          if printf '%s' "$body" | grep -Eq '@claude[[:space:]]+opus\b'; then
            echo "model=opus" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$body" | grep -Eq '@claude[[:space:]]+sonnet\b'; then
            echo "model=sonnet" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$body" | grep -Eq '@claude[[:space:]]+haiku\b'; then
            echo "model=haiku" >> "$GITHUB_OUTPUT"
          else
            echo "model=" >> "$GITHUB_OUTPUT"
          fi

          # Escape hatch for the session persistence below: a conversation that
          # grew too large, or drifted, can be reset from the comment itself
          # instead of waiting for the cache to be evicted.
          #
          # The word boundaries matter: without them "renew session" and
          # "renewed session" reset the thread too, and a reset is invisible --
          # Claude simply answers without the history the author expected it to
          # have. The Spanish branch stops at the "sesi" prefix on purpose, since
          # the `tr` above is ASCII-only and leaves the accent in "sesión" alone.
          if printf '%s' "$body" | grep -Eq '\b(new|fresh)[[:space:]]+session\b|\bnueva[[:space:]]+sesi'; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          fi

      # Runners are ephemeral, so Claude's conversation history dies with the run
      # unless it is carried across explicitly. This restores what the previous
      # run of THIS issue left behind; the matching save step runs after Claude.
      # Keyed by issue number, because `--continue` resumes whatever session the
      # CLI considers most recent -- state from an unrelated issue would be
      # resumed just as happily.
      - name: Restore Claude session
        id: session
        uses: ./.ci-actions/.github/actions/restore-claude-session
        with:
          thread-id: ${{ github.event.issue.number }}
          fresh: ${{ steps.model.outputs.fresh }}

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Empty on the first run, so the action falls back to the default branch.
          base_branch: ${{ steps.prev_branch.outputs.base }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Allow Claude to run the project's dev toolchain and Git/GitHub commands so it can
          # validate changes (tests, lint, type-check) and manage PRs without manual approval.
          #
          # `continue-flag` expands to `--continue` only when a transcript for
          # this workspace was actually restored: passing it without one makes
          # the CLI exit with "no conversation found".
          #
          # The session state is handed over as context rather than left to be read: the temporary
          # note in copilot-instructions.md requires every run to report whether it resumed a
          # conversation, and `$GITHUB_STEP_SUMMARY` -- where `restore-claude-session` writes it --
          # is unreadable with the tool set above. Passing the three outputs directly keeps the
          # requirement satisfiable no matter how narrow the allowed tools get.
          claude_args: |
            --allowed-tools Bash(uv:*),Bash(pytest:*),Bash(ruff:*),Bash(mypy:*),Bash(gh:*),Bash(git:*) --append-system-prompt "Session cache for this run: restored-key='${{ steps.session.outputs.restored-key }}' (empty means a cache miss, otherwise the key restored, exactly or through restore-keys); continue-flag='${{ steps.session.outputs.continue-flag }}' (literal --continue when a transcript for this workspace was restored, empty when this is a fresh conversation); save-key='${{ steps.session.outputs.cache-key }}'. Report all three in the comment you post on this thread, as the temporary note in .github/copilot-instructions.md requires." ${{ steps.session.outputs.continue-flag }} ${{ steps.model.outputs.model != '' && format('--model {0}', steps.model.outputs.model) || '' }}

      # No `if:` on purpose. The default `success()` means a failed run does not
      # become the next checkpoint of the conversation: the following run then
      # resumes the last state that actually completed, rather than one left
      # half-written. Switch to `if: always()` to checkpoint failures too.
      - name: Save Claude session
        uses: ./.ci-actions/.github/actions/save-claude-session
        with:
          cache-key: ${{ steps.session.outputs.cache-key }}
          session-path: ${{ steps.session.outputs.session-path }}
