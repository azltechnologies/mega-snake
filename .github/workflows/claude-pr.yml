name: Claude Code (PR)

# Claude on an existing pull request: review replies, inline comments and
# follow-up work. Claude commits straight to the PR's own branch, so a
# conversation here always continues where the previous turn left off.
#
# For work started from an issue, see claude-issue.yml. That one is the entry
# point; this one is where the iteration happens.
#
# NOTE: none of these triggers is a `pull_request` event, so GitHub always runs
# this file from the DEFAULT branch, and `actions/checkout` clones the default
# branch too. Edits to this workflow (or to .github/actions/setup-env) cannot be
# tested from a PR — they only take effect once merged.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # `github.event.issue.pull_request` only exists when the commented issue is
    # actually a PR; it is what keeps plain issues out of this workflow.
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for Claude to push commits to the PR branch
      pull-requests: write # Required for Claude to update the PR
      issues: write # Required for Claude to update its progress comment
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      # Resolved before the checkout, so the workspace starts on the branch the
      # conversation is actually about. Without this the checkout would default
      # to the repository's default branch, and `./.github/actions/setup-env`
      # below would be master's copy rather than the PR's.
      #
      # `gh` ships preinstalled on the runner, so this needs no checkout of its own.
      - name: Resolve PR branch
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          # `issue.number` on issue_comment, `pull_request.number` on the review
          # events -- each is empty on the other's trigger, and the session key
          # below needs it on both.
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          # Present on the review events, absent on issue_comment.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ -n "${HEAD_REF}" ]; then
            ref="${HEAD_REF}"
          else
            ref=$(gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
                    --json headRefName -q .headRefName)
          fi
          if [ -z "${ref}" ]; then
            echo "::error::Could not resolve the head branch for PR #${PR_NUMBER}"
            exit 1
          fi
          echo "Checking out PR branch: ${ref}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

          # Which conversation does this run belong to? Work that started in an
          # issue lands on a 'claude/issue-<n>-<timestamp>' branch, and the
          # thread the human is actually continuing began on that issue -- so the
          # persisted session to resume is the issue's, not a new one keyed by
          # the PR. For any other branch the PR is the start of the conversation
          # and its own number is the right key. Issues and PRs share a single
          # numbering sequence in GitHub, so the two cases can never collide.
          thread=$(printf '%s' "${ref}" | sed -n 's#^claude/issue-\([0-9]\{1,\}\)-.*#\1#p')
          if [ -z "${thread}" ]; then
            thread="${PR_NUMBER}"
            echo "Session thread: PR #${thread}"
          else
            echo "Session thread: issue #${thread} (origin of branch ${ref})"
          fi
          echo "thread=${thread}" >> "$GITHUB_OUTPUT"

      # NOTE: this assumes the PR comes from a branch in this repository. For a
      # fork PR the head ref lives in the fork, so this would either fail or —
      # worse — silently check out a same-named branch of ours. Supporting forks
      # means also passing `repository: github.event.pull_request.head.repo.full_name`,
      # and rethinking push permissions, which is out of scope here.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.ref }}
          fetch-depth: 1

      # The session actions are read from the DEFAULT BRANCH, never from the tree
      # this job checked out.
      #
      # A local `uses: ./…` is resolved against the *checked-out workspace*, not
      # against the ref the workflow file itself came from. These workflows run
      # from the default branch but check out the pull request's branch, so a
      # branch created before the session actions existed made the run die with
      # "Can't find 'action.yml' … under .github/actions/restore-claude-session"
      # — before Claude had even started, so the request was lost entirely rather
      # than answered without history. That is not hypothetical: it is how run
      # 32191217625 failed, and why no session has ever been saved.
      #
      # Pinning them here fixes that for every branch, however old, and closes a
      # second hole on the way: a pull request can no longer edit the action that
      # handles the session state and have this job run its version.
      #
      # `setup-env` is deliberately NOT pinned. It contains a nested local
      # `uses: ./.github/actions/setup-ai-context`, whose resolution from a
      # relocated composite action is exactly the ambiguity this step exists to
      # avoid — and it cannot be tested from a pull request. It has also existed
      # far longer than any branch likely to run here.
      - name: Check out the pinned session actions
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .ci-actions
          sparse-checkout: .github/actions
          fetch-depth: 1

      - name: Set up environment
        uses: ./.github/actions/setup-env
        with:
          requires-ai-context: "true"
          source-repo: ${{ secrets.AI_CONTEXT }}
          context-token: ${{ secrets.AI_CONTEXT_TOKEN }}

      - name: Parse trigger directives
        id: model
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          REVIEW_BODY: ${{ github.event.review.body }}
        run: |
          # Both variables come from the triggering event and only one of them is
          # ever set (a comment or a review, never both), so concatenating them
          # still reads exactly the text that asked for this run. Contrast with
          # claude-issue.yml, which has to choose between the comment and the
          # issue body to avoid making a directive permanent.
          body=$(printf '%s\n%s\n' "$COMMENT_BODY" "$REVIEW_BODY" | tr '[:upper:]' '[:lower:]')
          if printf '%s' "$body" | grep -Eq '@claude[[:space:]]+opus\b'; then
            echo "model=opus" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$body" | grep -Eq '@claude[[:space:]]+sonnet\b'; then
            echo "model=sonnet" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$body" | grep -Eq '@claude[[:space:]]+haiku\b'; then
            echo "model=haiku" >> "$GITHUB_OUTPUT"
          else
            echo "model=" >> "$GITHUB_OUTPUT"
          fi

          # Escape hatch for the session persistence below: a conversation that
          # grew too large, or drifted, can be reset from the comment itself
          # instead of waiting for the stored state to fall out of retention.
          #
          # The word boundaries matter: without them "renew session" and
          # "renewed session" reset the thread too, and a reset is invisible --
          # Claude simply answers without the history the author expected it to
          # have. The Spanish branch stops at the "sesi" prefix on purpose, since
          # the `tr` above is ASCII-only and leaves the accent in "sesión" alone.
          if printf '%s' "$body" | grep -Eq '\b(new|fresh)[[:space:]]+session\b|\bnueva[[:space:]]+sesi'; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          fi

      # Runners are ephemeral, so Claude's conversation history dies with the run
      # unless it is carried across explicitly. `thread` points at the issue this
      # PR came from when there is one, so the conversation started on the issue
      # keeps going here instead of restarting when the PR is opened.
      - name: Restore Claude session
        id: session
        uses: ./.ci-actions/.github/actions/restore-claude-session
        with:
          thread-id: ${{ steps.pr.outputs.thread }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fresh: ${{ steps.model.outputs.fresh }}

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Keep the whole PR conversation in a single comment instead of adding
          # one per turn; iteration here is expected to be chatty.
          use_sticky_comment: "true"

          # Allow Claude to run the project's dev toolchain and Git/GitHub commands so it can
          # validate changes (tests, lint, type-check) and manage PRs without manual approval.
          #
          # `continue-flag` expands to `--continue` only when a transcript for
          # this workspace was actually restored: passing it without one makes
          # the CLI exit with "no conversation found".
          #
          # The session state is handed over as context rather than left to be read: the temporary
          # note in copilot-instructions.md requires every run to report whether it resumed a
          # conversation, and `$GITHUB_STEP_SUMMARY` -- where `restore-claude-session` writes it --
          # is unreadable with the tool set above. Passing the outputs directly keeps the
          # requirement satisfiable no matter how narrow the allowed tools get. The turn number
          # rides along for a different reason: a run cannot work out its own position in the
          # conversation from what it remembers, and has been observed getting it exactly
          # backwards -- see the reporting section of that same note.
          claude_args: |
            --allowed-tools Bash(uv:*),Bash(pytest:*),Bash(ruff:*),Bash(mypy:*),Bash(gh:*),Bash(git:*) --append-system-prompt "Session state for this run, computed by the workflow and not by you: this is turn ${{ steps.session.outputs.turn }} of this conversation; ${{ steps.session.outputs.state }}; continue-flag='${{ steps.session.outputs.continue-flag }}' (literal --continue when a transcript for this workspace was restored, empty when this is a fresh conversation); artifact='${{ steps.session.outputs.artifact-name }}' (the artifact name this run's state is uploaded under). These four values describe THIS run and override everything else. A resumed conversation always contains the previous turn's own report of its session state, and the thread's comments contain it too; both are stale by construction. If what you remember, or a comment already posted, disagrees with the values above, the values above are right and your memory is a previous turn talking. Never restate an earlier turn's session state as your own, and never work out which turn you are from the conversation -- the number is given to you above precisely because that inference has been got wrong before. Report the turn number, what was restored, and whether --continue was passed, in the comment you post on this thread, as the temporary note in .github/copilot-instructions.md requires." ${{ steps.session.outputs.continue-flag }} ${{ steps.model.outputs.model != '' && format('--model {0}', steps.model.outputs.model) || '' }}

      # No `if:` on purpose. The default `success()` means a failed run does not
      # become the next checkpoint of the conversation: the following run then
      # resumes the last state that actually completed, rather than one left
      # half-written. Switch to `if: always()` to checkpoint failures too.
      - name: Save Claude session
        uses: ./.ci-actions/.github/actions/save-claude-session
        with:
          artifact-name: ${{ steps.session.outputs.artifact-name }}
          turn: ${{ steps.session.outputs.turn }}
          session-path: ${{ steps.session.outputs.session-path }}
