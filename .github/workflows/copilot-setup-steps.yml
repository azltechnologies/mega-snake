name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/setup-env/action.yml
      - .github/actions/setup-ai-context/action.yml
      - .python-version
      - pyproject.toml
      - uv.lock

jobs:
  copilot-setup-steps: # This name is mandatory
    runs-on: ubuntu-latest
    permissions:
      contents: read # This is mandatory to allow the action to read the repository contents
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/actions/setup-env
        with:
          requires-ai-context: "true"
          source-repo: ${{ secrets.AI_CONTEXT }}
          context-token: ${{ secrets.AI_CONTEXT_TOKEN }}

      # The venv is materialized up front so the agent can run pytest/ruff/mypy
      # straight away instead of spending a turn on `uv sync`. `--locked` fails
      # when uv.lock no longer agrees with pyproject.toml, instead of silently
      # re-resolving into a non-reproducible environment.
      - name: Install dependencies
        run: |
          uv sync --locked --all-extras
