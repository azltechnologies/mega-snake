name: Restore Claude Session

# GitHub-hosted runners are ephemeral: everything Claude Code writes during a run
# is gone by the time the next comment on the same issue arrives. This action
# carries that state forward as a workflow artifact, so a follow-up run can
# resume the previous conversation with `--continue` instead of starting from
# zero.
#
# It only *restores*. The matching `save-claude-session` action writes the next
# link of the chain, so the save condition can stay explicit -- a failed run must
# not become the checkpoint the next one resumes from.
#
# WHY ARTIFACTS AND NOT `actions/cache`
# -------------------------------------
# This used to be an `actions/cache` chain, and on 2026-06-26 GitHub made the
# cache read-only for untrusted triggers:
# https://github.blog/changelog/2026-06-26-read-only-actions-cache-for-untrusted-triggers/
# Only `push`, `schedule`, `workflow_dispatch`, `repository_dispatch`, `delete`,
# `registry_package` and `page_build` keep write access to the default branch's
# cache scope. `issue_comment` -- the trigger of the entire `@claude` workflow --
# is on the restricted side, and its `GITHUB_REF` is the default branch, so the
# only scope it could write to is exactly the one it was denied. Every save from
# an issue thread failed with:
#
#     Cache reservation failed: cache write denied: token has no writable scopes
#
# `actions/cache` reports that as a *warning* and the job goes green, so the
# chain looked healthy while nothing was ever stored: `gh cache list` held no
# `claude-session-*` entry for any issue thread. Artifacts are not restricted by
# that change and are the workaround GitHub's own documentation points to.
#
# Three things get better on the way, and one gets worse:
#
# * Artifacts are not branch-scoped. A cache written on `refs/pull/<n>/merge` was
#   invisible to a later `issue_comment` run on the default branch, so a review
#   turn and a comment turn on the same pull request could not see each other's
#   state. Looking an artifact up by name crosses that boundary.
# * There are no immutable keys, so the name is stable and the lookup is a plain
#   "newest artifact with this name" instead of a `restore-keys` prefix match.
# * Expiry is a retention window we set, not an eviction policy we observe.
# * Reading one costs an API call and the `actions: read` permission, which every
#   calling workflow must grant. A cache restore needed neither.
#
# WHAT IS PERSISTED, AND WHY NOT MORE
# -----------------------------------
# The stored path is `~/.claude/projects`, never `~/.claude` itself.
# `~/.claude/.credentials.json` holds the OAuth token minted from
# CLAUDE_CODE_OAUTH_TOKEN, and an artifact is downloadable by anyone who can read
# the repository. Persisting the whole home directory would therefore publish a
# live credential. The conversation transcripts under `projects/` are all that
# `--continue` needs.
#
# Note that transcripts are still repository content: anything Claude read during
# a run is inside them. Keep that in mind before enabling this on a repository
# that accepts fork pull requests, and keep the retention window short.
#
# KNOWN LIMITATIONS
# -----------------
# * Linux runners only: the transcript lookup here and the pruning in
#   `save-claude-session` use `find -printf`, which is a GNU extension and is
#   absent from the BSD `find` shipped by macOS runners.
# * Two comments posted on the same thread while a run is in flight both restore
#   the same state and then upload one artifact each, so the chain keeps whichever
#   finished last and the other turn drops out of the conversation. Serialising
#   with a workflow-level `concurrency` group would fix that, at the price of
#   GitHub silently cancelling an already-queued run -- losing a request outright
#   is worse than losing its history, so the race is left in place.
description: >-
  Restores the Claude Code conversation state produced by the previous run of the
  same GitHub thread, and reports whether the next `claude` invocation can safely
  resume it with `--continue`.

inputs:
  thread-id:
    description: >-
      Number of the issue (or pull request) that owns the conversation. This is
      what isolates one conversation's state from every other one, so it is
      mandatory -- a shared name would let `--continue` resume the wrong thread.
      Issues and pull requests share a single numbering sequence in GitHub, so a
      bare number is already unambiguous.
    required: true
  # Never write the `secrets.GITHUB_TOKEN` reference below as a `${…}` expression,
  # not even here in the prose: GitHub's template parser evaluates every expression
  # in this file wherever it sits, description strings included, and `secrets` is
  # not a context a composite action has. One in a description was enough to make
  # the whole file fail to load with "Unrecognized named-value: 'secrets'", taking
  # all three Claude workflows down at once. The secret is passed in by the calling
  # workflow, which is the only place that can read one.
  github-token:
    description: >-
      Token used to list and download the stored artifact. Needs the `actions:
      read` permission; the workflow's own GITHUB_TOKEN is enough as long as the
      calling job grants that permission. Unlike a cache restore, reading an
      artifact written by a *previous* run goes through the REST API, so there is
      no way to do this tokenless.
    required: true
  thread-kind:
    description: >-
      Namespace for the conversation, so two different kinds of run on the *same*
      number keep separate histories. `issue` is the working conversation, which
      writes code and answers `@claude`; `review` is the code reviewer, which must
      stay independent of it -- a reviewer resuming the implementer's session would
      be reviewing code it remembers writing, and would inherit every assumption
      that went into it. Consecutive reviews of one pull request still chain to
      each other, which is the point.
    required: false
    default: issue
  state-version:
    description: >-
      Component of the artifact name used to invalidate every stored session at
      once. Bump it when a change makes previously stored state unusable.
    required: false
    default: v1
  fresh:
    description: >-
      When "true", nothing is restored and `continue-flag` stays empty, so Claude
      starts a brand new conversation. The escape hatch for a session that grew
      too large or went off the rails; the next save then starts a new chain.
    required: false
    default: "false"

outputs:
  artifact-name:
    description: >-
      The name the new state must be stored under, and the name this action looked
      up. Pass it verbatim to `save-claude-session`. It is stable across runs of
      the same thread on purpose -- that is what makes the lookup possible.
    value: ${{ steps.resolve.outputs.artifact-name }}
  restored-from:
    description: >-
      Id of the workflow run whose state was restored, empty when nothing was.
      A first run on a thread always reports empty; later runs report the run
      they are resuming.
    value: ${{ steps.restore.outputs.restored-from }}
  continue-flag:
    description: >-
      Literal `--continue` when a resumable transcript for this workspace was
      restored, empty otherwise. Interpolate it straight into `claude_args`:
      passing `--continue` with no prior session makes the CLI fail.
    value: ${{ steps.detect.outputs.continue-flag }}
  session-path:
    description: The directory that holds the persisted state.
    value: ${{ steps.resolve.outputs.path }}
  turn:
    description: >-
      Which turn of this conversation this run is: `1` on a thread that has none
      stored, the previous turn plus one otherwise. Pass it to
      `save-claude-session`, and hand it to the model.

      It exists because a run cannot work out its own position from what it
      remembers. Three consecutive runs on issue #73 chained correctly and all
      three reported it wrong: the second resumed the first's transcript, found a
      turn in it that said "first run, cache miss", and published that as its own
      state while quoting this run's real values one line below. A counter the
      workflow computes is the one statement about the conversation that no
      narrative inside the conversation can contradict.
    value: ${{ steps.detect.outputs.turn }}
  state:
    description: >-
      One plain sentence describing what this run restored, ready to hand to the
      model verbatim. Deliberately free of backticks and quotes: it is
      interpolated into a shell command line.
    value: ${{ steps.detect.outputs.state }}

runs:
  using: composite
  steps:
    - name: Resolve the artifact name
      id: resolve
      shell: bash
      env:
        THREAD_ID: ${{ inputs.thread-id }}
        THREAD_KIND: ${{ inputs.thread-kind }}
        STATE_VERSION: ${{ inputs.state-version }}
      run: |
        set -euo pipefail
        if ! printf '%s' "${THREAD_ID}" | grep -Eq '^[0-9]+$'; then
          echo "::error::thread-id must be a number, got '${THREAD_ID}'"
          exit 1
        fi
        # Constrained rather than interpolated as-is: the value becomes part of
        # the artifact name, and a stray character or an empty string would let
        # one namespace collide with another's -- the exact isolation this input
        # exists to provide. Anchored, so 'review-x' and 'review ' are refused.
        if ! printf '%s' "${THREAD_KIND}" | grep -Eq '^[a-z]+$'; then
          echo "::error::thread-kind must be lowercase letters only, got '${THREAD_KIND}'"
          exit 1
        fi
        if ! printf '%s' "${STATE_VERSION}" | grep -Eq '^[a-z0-9]+$'; then
          echo "::error::state-version must be lowercase letters and digits only, got '${STATE_VERSION}'"
          exit 1
        fi

        # No run id in the name, unlike the cache key this replaces: cache
        # entries are immutable so every run needed a key of its own, whereas
        # several artifacts may share a name. A *stable* name is what turns the
        # lookup into an exact `?name=` query instead of a prefix scan.
        {
          echo "artifact-name=claude-session-${STATE_VERSION}-${THREAD_KIND}-${THREAD_ID}"
          echo "path=${HOME}/.claude/projects"
        } >> "$GITHUB_OUTPUT"

    - name: Restore Claude session
      id: restore
      if: inputs.fresh != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ARTIFACT_NAME: ${{ steps.resolve.outputs.artifact-name }}
        SESSION_PATH: ${{ steps.resolve.outputs.path }}
      run: |
        set -euo pipefail

        # Every failure below is a warning and an early exit, never an error:
        # the worst case of not restoring is a conversation that starts over,
        # and failing the job would turn a degraded answer into no answer at
        # all. `detect` reports what actually happened either way.

        # `?name=` is an exact match, so this is the whole thread's history and
        # nothing else. Expired artifacts are still listed, hence the filter;
        # ids increase monotonically, so the largest one is the newest.
        if ! listing=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | max_by(.id) | select(. != null) | "\(.id) \(.workflow_run.id)"' 2>&1); then
          echo "::warning::Could not list artifacts named '${ARTIFACT_NAME}' (needs the 'actions: read' permission): ${listing}"
          exit 0
        fi

        if [ -z "${listing}" ]; then
          echo "No stored session named '${ARTIFACT_NAME}'."
          exit 0
        fi

        artifact_id=${listing%% *}
        source_run=${listing##* }
        archive="${RUNNER_TEMP}/claude-session.zip"

        if ! gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${archive}"; then
          echo "::warning::Could not download session artifact ${artifact_id}; starting a new session."
          exit 0
        fi

        staging="${RUNNER_TEMP}/claude-session"
        rm -rf "${staging}"
        mkdir -p "${staging}"
        if ! unzip -qo "${archive}" -d "${staging}"; then
          echo "::warning::Session artifact ${artifact_id} could not be unpacked; starting a new session."
          exit 0
        fi

        # `save-claude-session` uploads the transcripts under `projects/` with the
        # turn counter beside them, so both are read from the archive root. A
        # flat archive -- anything stored before the counter existed -- is still
        # accepted: the transcripts are then the root itself. The two layouts are
        # never ambiguous, because a Claude project directory is named after an
        # absolute path and therefore always starts with a dash.
        if [ -d "${staging}/projects" ]; then
          transcripts="${staging}/projects"
        else
          transcripts="${staging}"
        fi

        # `tr -dc` rather than a validation, because a malformed counter must not
        # cost us a restore that otherwise succeeded.
        previous_turn=""
        if [ -f "${staging}/turn" ]; then
          previous_turn=$(tr -dc '0-9' < "${staging}/turn" | head -c 9)
        fi
        # An archive from before the counter existed carries no `turn` file, and
        # a run that restored one is still not the first. Falling back to 1 makes
        # this run report turn 2; falling back to 0 would make it announce itself
        # as the first turn while resuming somebody else's transcript, which is
        # the exact confusion the counter exists to prevent.
        [ -n "${previous_turn}" ] || previous_turn=1

        mkdir -p "${SESSION_PATH}"
        cp -a "${transcripts}/." "${SESSION_PATH}/"
        {
          echo "restored-from=${source_run}"
          echo "previous-turn=${previous_turn}"
        } >> "$GITHUB_OUTPUT"
        echo "Restored session artifact ${artifact_id}, written by run ${source_run}, turn ${previous_turn}."

    - name: Detect resumable session
      id: detect
      shell: bash
      env:
        FRESH: ${{ inputs.fresh }}
        RESTORED_FROM: ${{ steps.restore.outputs.restored-from }}
        PREVIOUS_TURN: ${{ steps.restore.outputs.previous-turn }}
        SESSION_PATH: ${{ steps.resolve.outputs.path }}
        ARTIFACT_NAME: ${{ steps.resolve.outputs.artifact-name }}
        THREAD_ID: ${{ inputs.thread-id }}
        THREAD_KIND: ${{ inputs.thread-kind }}
      run: |
        set -euo pipefail

        # Claude Code keeps one directory per working directory, named after the
        # workspace's absolute path with the separators folded into dashes, and
        # the transcripts inside it as `.jsonl` files. `--continue` resolves the
        # session from the *current* working directory, so a transcript recorded
        # under some other path is not resumable and must not raise the flag.
        #
        # Two spellings are probed because the exact sanitisation has differed
        # between Claude Code versions: only the separators, or every character
        # outside [A-Za-z0-9].
        candidates=(
          "${GITHUB_WORKSPACE//\//-}"
          "$(printf '%s' "${GITHUB_WORKSPACE}" | sed 's/[^A-Za-z0-9]/-/g')"
        )

        newest=""
        for slug in "${candidates[@]}"; do
          dir="${SESSION_PATH}/${slug}"
          [ -d "${dir}" ] || continue
          # -size +0 skips a truncated transcript, which `--continue` would
          # either reject or resume as an empty conversation.
          found=$(find "${dir}" -maxdepth 1 -type f -name '*.jsonl' -size +0c \
                    -printf '%T@\t%p\n' 2>/dev/null | sort -nr | head -n 1 | cut -f2-)
          if [ -n "${found}" ]; then
            newest="${found}"
            break
          fi
        done

        # The counter belongs to the conversation, not to the run: a fresh
        # session restarts it, because that is a new conversation whatever came
        # before. Anything non-numeric is treated as absent rather than fed to
        # the arithmetic below, which would abort the step.
        #
        # An unusable counter falls back to the *restore* rather than to zero,
        # so the invariant holds in every branch: a run that resumed somebody
        # else's transcript never announces itself as turn 1. Announcing turn 1
        # while resuming is precisely the state that made three consecutive runs
        # on issue #73 each report the chain as broken.
        case "${PREVIOUS_TURN}" in
          '' | *[!0-9]*) [ -n "${RESTORED_FROM}" ] && previous=1 || previous=0 ;;
          *) previous=${PREVIOUS_TURN} ;;
        esac
        turn=$((previous + 1))

        # No backticks and no quotes in `state`: it is handed to the model
        # through a shell command line, where a backtick is a command
        # substitution. The step summary below reads fine without them.
        if [ "${FRESH}" = "true" ]; then
          state="a fresh session was requested, so nothing was restored and this conversation starts over at turn 1"
          flag=""
          turn=1
        elif [ -n "${newest}" ]; then
          state="resuming session $(basename "${newest}" .jsonl), stored by run ${RESTORED_FROM}"
          flag="--continue"
        elif [ -n "${RESTORED_FROM}" ]; then
          # State was restored but held no transcript for this workspace.
          # Passing `--continue` here would fail the run, so a new conversation
          # starts instead.
          state="state from run ${RESTORED_FROM} was restored but holds no transcript for this workspace, so a new session starts"
          flag=""
        else
          state="nothing is stored for this thread yet, so a new session starts"
          flag=""
        fi

        {
          echo "continue-flag=${flag}"
          echo "turn=${turn}"
          echo "state=${state}"
        } >> "$GITHUB_OUTPUT"
        echo "Claude session: turn ${turn}, ${state}"
        {
          echo "### Claude session"
          echo ""
          echo "- Turn: ${turn}"
          echo "- Restore: ${state}"
          echo "- Thread: \`${THREAD_KIND} #${THREAD_ID}\`"
          echo "- Artifact: \`${ARTIFACT_NAME}\`"
        } >> "$GITHUB_STEP_SUMMARY"
