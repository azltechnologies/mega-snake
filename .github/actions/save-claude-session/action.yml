name: Save Claude Session

# Stores the conversation state produced by this run as the next link of the
# thread's chain, so the next comment on the same issue can resume it. The
# counterpart of `restore-claude-session`; see that action for why the state
# travels as an artifact rather than a cache, and why only `~/.claude/projects`
# is persisted and never `~/.claude` itself.
#
# WHY THE PRUNE IS A STEP OF ITS OWN
# ----------------------------------
# A conversation that keeps growing turns into an upload that keeps growing,
# slowing every subsequent run down. Pruning immediately before the upload gives
# us that window, and keeps the save condition explicit: placed after the Claude
# step with the default `success()` condition, a failed run does not become the
# next checkpoint of the conversation.
description: >-
  Prunes and uploads the Claude Code conversation state under the artifact name
  produced by `restore-claude-session`.

inputs:
  artifact-name:
    description: >-
      The `artifact-name` output of `restore-claude-session`. Must be that exact
      value: it is the name the *next* run looks up.
    required: true
  session-path:
    description: The `session-path` output of `restore-claude-session`.
    required: true
  github-token:
    description: >-
      Token used to complete this run's row in the session log. Needs the write
      permission for the thread being commented on (`issues: write`, or
      `pull-requests: write` on a pull request).
    required: true
  turn:
    description: >-
      The `turn` output of `restore-claude-session`. Stored beside the
      transcripts so the next run can tell the model where in the conversation
      it is, instead of leaving it to work that out from what it remembers --
      which it does badly, see that action's `turn` output for the incident.
    required: true
  keep-sessions:
    description: >-
      How many of the most recent transcripts to keep per project directory.
      `--continue` only ever resolves the newest one; the extras are kept as a
      small safety margin for manual `--resume` debugging.
    required: false
    default: "3"
  warn-size-mb:
    description: >-
      Emit a workflow warning when the pruned state exceeds this size, as an
      early signal that the conversation should be summarised and restarted.
    required: false
    default: "50"
  comment-id:
    description: >-
      The `comment-id` output of `restore-claude-session`. The row this run added
      to the session log says `running` until the state is actually stored; this
      is what lets the size be reported at all, since the save necessarily
      happens after the Claude step and nothing inside the run can see it.
      Empty is tolerated: a log that could not be posted must not fail a save.
    required: false
    default: ""
  retention-days:
    description: >-
      How long GitHub keeps the uploaded state. This is also how long a thread
      can stay quiet before its history is gone, so it is a conversation-length
      decision as much as a storage one. Kept short deliberately: the transcripts
      are downloadable by every reader of the repository, and a session nobody
      has touched in a week is not worth resuming.
    required: false
    default: "7"

runs:
  using: composite
  steps:
    - name: Prune and stage the Claude session state
      id: prune
      shell: bash
      env:
        SESSION_PATH: ${{ inputs.session-path }}
        KEEP_SESSIONS: ${{ inputs.keep-sessions }}
        WARN_SIZE_MB: ${{ inputs.warn-size-mb }}
        RETENTION_DAYS: ${{ inputs.retention-days }}
        TURN: ${{ inputs.turn }}
      run: |
        set -euo pipefail

        # The numeric inputs are validated together, and *before* the early exit
        # below, for two reasons: an unchecked value reaches an arithmetic test
        # (`-lt`, `-ge`) that aborts the step with a bash syntax error instead of
        # a readable message, and validating only when state happens to exist
        # would let a typo sit dormant until the run that actually had to save.
        require_positive_int() {
          if ! printf '%s' "$2" | grep -Eq '^[0-9]+$' || [ "$2" -lt 1 ]; then
            echo "::error::$1 must be a positive number, got '$2'"
            exit 1
          fi
        }
        require_positive_int keep-sessions "${KEEP_SESSIONS}"
        require_positive_int warn-size-mb "${WARN_SIZE_MB}"
        require_positive_int retention-days "${RETENTION_DAYS}"
        require_positive_int turn "${TURN}"

        if [ ! -d "${SESSION_PATH}" ]; then
          echo "No Claude state at ${SESSION_PATH}; nothing to save."
          echo "has-state=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Defensive only: credentials live in ~/.claude, one level above the
        # uploaded directory, so they are already out of scope. This guards
        # against a future Claude Code version dropping a token beside the
        # transcripts, which would otherwise be published to every reader of the
        # artifact. `-name` matches a leading dot, so `.credentials.json` is
        # covered -- which is what makes `include-hidden-files` safe below.
        find "${SESSION_PATH}" -type f -name '*credential*' -print -delete

        # Keep the newest transcripts per project directory and drop the rest.
        # Sorting by mtime rather than by name because the file names are
        # opaque session UUIDs and carry no ordering.
        while IFS= read -r project; do
          find "${project}" -maxdepth 1 -type f -name '*.jsonl' -printf '%T@\t%p\n' \
            | sort -nr | tail -n "+$((KEEP_SESSIONS + 1))" | cut -f2- \
            | while IFS= read -r stale; do
                echo "Pruning stale transcript: ${stale}"
                rm -f "${stale}"
              done
        done < <(find "${SESSION_PATH}" -mindepth 1 -maxdepth 1 -type d)

        if [ -z "$(find "${SESSION_PATH}" -type f -print -quit)" ]; then
          echo "Claude state is empty after pruning; nothing worth uploading."
          echo "has-state=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        size_kb=$(du -sk "${SESSION_PATH}" | cut -f1)
        size_mb=$((size_kb / 1024))

        # The archive is assembled here rather than uploading `SESSION_PATH`
        # directly, so the turn counter travels *beside* the transcripts instead
        # of inside the directory Claude Code owns. Nothing of ours is written
        # into `~/.claude`, and the layout the next run unpacks is one we chose:
        #
        #     turn                  <- this conversation's position, as a number
        #     projects/<slug>/*.jsonl
        #
        upload_path="${RUNNER_TEMP}/claude-session-upload"
        rm -rf "${upload_path}"
        mkdir -p "${upload_path}"
        cp -a "${SESSION_PATH}" "${upload_path}/projects"
        printf '%s\n' "${TURN}" > "${upload_path}/turn"

        {
          echo "has-state=true"
          echo "size-mb=${size_mb}"
          echo "size-kb=${size_kb}"
          echo "upload-path=${upload_path}"
        } >> "$GITHUB_OUTPUT"

        if [ "${size_mb}" -ge "${WARN_SIZE_MB}" ]; then
          echo "::warning::The persisted Claude session is ${size_mb} MB (threshold ${WARN_SIZE_MB} MB). Consider summarising the conversation and starting a fresh session."
        fi

        {
          echo "- Save: \`${size_mb}\` MB persisted as turn ${TURN}, kept for ${RETENTION_DAYS} days"
        } >> "$GITHUB_STEP_SUMMARY"

    # `if-no-files-found: error` on purpose. The prune step above has already
    # established that files exist, so an empty upload here can only mean the
    # glob excluded them -- and a silently empty artifact is the one failure
    # mode that looks exactly like a healthy chain until the next run starts
    # from zero. `include-hidden-files` is what keeps that from happening if a
    # future Claude Code version writes dot-files among the transcripts.
    # Closes this run's row in the session log. It has to happen here rather than
    # in `restore-claude-session`, because the size only exists once the state has
    # been pruned and stored -- which is exactly why no run could ever report it
    # before, and why the temporary note had to tell agents not to guess at it.
    - name: Complete the session log row
      if: steps.prune.outputs.has-state == 'true' && inputs.comment-id != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        COMMENT_ID: ${{ inputs.comment-id }}
        SIZE_KB: ${{ steps.prune.outputs.size-kb }}
        TURN: ${{ inputs.turn }}
      run: |
        set -uo pipefail
        api="repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}"
        body_file="${RUNNER_TEMP}/session-log-complete.md"

        if ! gh api "${api}" --jq '.body' | tr -d '\r' > "${body_file}"; then
          echo "::warning::Could not read the session log comment ${COMMENT_ID}; the row stays open."
          exit 0
        fi

        # The final line only, which is this run's row. An earlier row still
        # reading `running` belongs to a run that genuinely never finished, and
        # rewriting it here would erase exactly that signal.
        sed -i "\$ s/| running |\$/| ${SIZE_KB} KB |/" "${body_file}"

        if ! gh api --method PATCH "${api}" -F body=@"${body_file}" --silent; then
          echo "::warning::Could not complete the session log row on comment ${COMMENT_ID}."
          exit 0
        fi
        echo "Session log: turn ${TURN} completed with ${SIZE_KB} KB."

    - name: Save Claude session
      if: steps.prune.outputs.has-state == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.prune.outputs.upload-path }}
        retention-days: ${{ inputs.retention-days }}
        include-hidden-files: true
        if-no-files-found: error
