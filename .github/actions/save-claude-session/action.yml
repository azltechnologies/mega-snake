name: Save Claude Session

# Stores the conversation state produced by this run as the next link of the
# thread's cache chain, so the next comment on the same issue can resume it.
# The counterpart of `restore-claude-session`; see that action for why only
# `~/.claude/projects` is persisted and never `~/.claude` itself.
#
# WHY THIS IS A REGULAR STEP AND NOT `actions/cache`'s POST PHASE
# --------------------------------------------------------------
# `actions/cache` saves automatically after the job, which leaves no room to
# prune the transcripts first -- and a conversation that keeps growing turns into
# a cache that keeps growing, slowing every subsequent run down. Splitting the
# restore and the save gives us that window, and makes the save condition
# explicit: placed after the Claude step with the default `success()` condition,
# a failed run does not become the next checkpoint of the conversation.
description: >-
  Prunes and stores the Claude Code conversation state under the key produced by
  `restore-claude-session`.

inputs:
  cache-key:
    description: >-
      The `cache-key` output of `restore-claude-session`. Must be that exact
      value: it is the key the *next* run finds through its `restore-keys`
      prefix.
    required: true
  session-path:
    description: The `session-path` output of `restore-claude-session`.
    required: true
  keep-sessions:
    description: >-
      How many of the most recent transcripts to keep per project directory.
      `--continue` only ever resolves the newest one; the extras are kept as a
      small safety margin for manual `--resume` debugging.
    required: false
    default: "3"
  warn-size-mb:
    description: >-
      Emit a workflow warning when the pruned state exceeds this size, as an
      early signal that the conversation should be summarised and restarted.
    required: false
    default: "50"

runs:
  using: composite
  steps:
    - name: Prune Claude session state
      id: prune
      shell: bash
      env:
        SESSION_PATH: ${{ inputs.session-path }}
        KEEP_SESSIONS: ${{ inputs.keep-sessions }}
        WARN_SIZE_MB: ${{ inputs.warn-size-mb }}
      run: |
        set -euo pipefail

        # Both numeric inputs are validated together, and *before* the early exit
        # below, for two reasons: an unchecked value reaches an arithmetic test
        # (`-lt`, `-ge`) that aborts the step with a bash syntax error instead of
        # a readable message, and validating only when state happens to exist
        # would let a typo sit dormant until the run that actually had to save.
        require_positive_int() {
          if ! printf '%s' "$2" | grep -Eq '^[0-9]+$' || [ "$2" -lt 1 ]; then
            echo "::error::$1 must be a positive number, got '$2'"
            exit 1
          fi
        }
        require_positive_int keep-sessions "${KEEP_SESSIONS}"
        require_positive_int warn-size-mb "${WARN_SIZE_MB}"

        if [ ! -d "${SESSION_PATH}" ]; then
          echo "No Claude state at ${SESSION_PATH}; nothing to save."
          echo "has-state=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Defensive only: credentials live in ~/.claude, one level above the
        # cached directory, so they are already out of scope. This guards against
        # a future Claude Code version dropping a token beside the transcripts,
        # which would otherwise be published to every reader of the cache.
        find "${SESSION_PATH}" -type f -name '*credential*' -print -delete

        # Keep the newest transcripts per project directory and drop the rest.
        # Sorting by mtime rather than by name because the file names are
        # opaque session UUIDs and carry no ordering.
        while IFS= read -r project; do
          find "${project}" -maxdepth 1 -type f -name '*.jsonl' -printf '%T@\t%p\n' \
            | sort -nr | tail -n "+$((KEEP_SESSIONS + 1))" | cut -f2- \
            | while IFS= read -r stale; do
                echo "Pruning stale transcript: ${stale}"
                rm -f "${stale}"
              done
        done < <(find "${SESSION_PATH}" -mindepth 1 -maxdepth 1 -type d)

        if [ -z "$(find "${SESSION_PATH}" -type f -print -quit)" ]; then
          echo "Claude state is empty after pruning; nothing worth caching."
          echo "has-state=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        size_kb=$(du -sk "${SESSION_PATH}" | cut -f1)
        size_mb=$((size_kb / 1024))
        echo "has-state=true" >> "$GITHUB_OUTPUT"
        echo "size-mb=${size_mb}" >> "$GITHUB_OUTPUT"

        if [ "${size_mb}" -ge "${WARN_SIZE_MB}" ]; then
          echo "::warning::The persisted Claude session is ${size_mb} MB (threshold ${WARN_SIZE_MB} MB). Consider summarising the conversation and starting a fresh session."
        fi

        {
          echo "- Save: \`${size_mb}\` MB persisted for the next run"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Save Claude session
      if: steps.prune.outputs.has-state == 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ inputs.session-path }}
        key: ${{ inputs.cache-key }}
