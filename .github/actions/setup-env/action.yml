name: Setup Env
description: >-
  Prepares the Python toolchain shared by the Copilot and Claude workflows:
  Python 3.13, uv, and a ready-to-use virtual environment.

runs:
  using: composite
  steps:
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Upgrade pip
      shell: bash
      run: python -m pip install --upgrade pip setuptools wheel

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Verify toolchain
      shell: bash
      run: |
        python --version
        pip --version
        uv --version

    - name: Create virtual environment
      shell: bash
      run: uv venv
