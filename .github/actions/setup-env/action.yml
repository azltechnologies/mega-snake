name: Setup Env
description: >-
  Prepares the Python toolchain shared by the Copilot and Claude workflows:
  Python 3.13 and uv. Callers run `uv sync` to materialize the virtual environment.

runs:
  using: composite
  steps:
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true

    - name: Verify toolchain
      shell: bash
      run: |
        python --version
        uv --version
