name: Setup Env
description: >-
  Prepares the Python toolchain shared by the Copilot and Claude workflows:
  Python (from `.python-version`), uv, and the synced virtual environment
  (`uv sync --locked --all-extras`). When `requires-ai-context` is true it also
  assembles the shared AI context files into the workspace.

inputs:
  token:
    default: ${{ github.token }}
  repo:
    default: ${{ github.repository }}

runs:
  using: composite
  steps:
    - name: Validate supported event
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        EVENT_ACTION: ${{ github.event.action }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        ISSUE_PULL_REQUEST: ${{ github.event.issue.pull_request }}
        PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        case "$EVENT_NAME:$EVENT_ACTION" in
          issue_comment:created)
            THREAD_ID=$ISSUE_NUMBER
            if [[ -n "$ISSUE_PULL_REQUEST" ]]; then
              THREAD_TYPE="pull_request"
            else
              THREAD_TYPE="issue"
            fi
            ;;
          
          pull_request_review_comment:created|\
          pull_request_review:submitted|\
          pull_request:labeled)
            THREAD_ID="$PULL_REQUEST_NUMBER"
            THREAD_TYPE="pull_request"
            ;;
          *)
            echo "::error::Unsupported event: $EVENT_NAME:$EVENT_ACTION"
            exit 1
            ;;
        esac

        if [[ -z "$THREAD_ID" ]]; then
          echo "::error::Could not determine thread ID."
          exit 1
        fi

        echo "THREAD_ID=$THREAD_ID" >> "$GITHUB_ENV"
        echo "THREAD_TYPE=$THREAD_TYPE" >> "$GITHUB_ENV"

    - name: Testing command
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        API: "repos/${{ inputs.repo }}"
        MARKER: "<!-- mgsnake-session-log:${{ env.THREAD_TYPE }}/${{ env.THREAD_ID }} -->"
      run: |
        set -euo pipefail
        call=$(gh api "${API}/issues/${THREAD_ID}/comments?per_page=100" --paginate \
        --jq '.[] | "\(.id)\t\(.body | split("\n")[0] | rtrimstr("\r"))"')
        echo "results: ${call}"
        echo "Searching for comment with marker: ${MARKER}"
        comment_id=$(echo "$call" | awk -F'\t' -v m="${MARKER}" '$2 == m { print $1 }' | tail -n 1)
        if [[ -n "$comment_id" ]]; then
          echo "Found comment ID: $comment_id"
          echo "COMMENT_ID=$comment_id" >> "$GITHUB_ENV"
        else
          echo -e "No comment found with marker: ${MARKER}\n creating a new comment..."
          create_id=$(gh api --method POST "${API}/issues/${THREAD_ID}/comments" -f body="${MARKER}" \
          --jq '.id')
          echo "Created comment ID: $create_id"
          echo "COMMENT_ID=$create_id" >> "$GITHUB_ENV"
        fi
