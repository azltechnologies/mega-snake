name: Setup Env
description: >-
  TypeScript port of the composite `task` action. Resolves the thread
  (issue or pull request) that triggered the workflow and ensures a
  session-log comment exists on it, exporting THREAD_ID, THREAD_TYPE and
  COMMENT_ID to the job environment. The repository is read from the
  GITHUB_REPOSITORY environment variable the runner provides.

inputs:
  token:
    description: Token used to read and create issue comments.
    default: ${{ github.token }}

runs:
  using: node24
  main: dist/index.js
